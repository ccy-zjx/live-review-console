<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="直播中控">
    <title>直播中控 - 手机版</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background:#f5f6fa; padding:12px; max-width:420px; margin:0 auto; }
        .header { text-align:center; padding:16px 0; }
        .header h1 { font-size:18px; }
        .header p { color:#999; font-size:12px; margin-top:4px; }
        .tabs { display:flex; gap:2px; background:#e8e8e8; border-radius:10px; padding:3px; margin-bottom:16px; }
        .tabs button { flex:1; padding:10px; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; background:transparent; color:#666; }
        .tabs button.active { background:#fff; color:#6c5ce7; box-shadow:0 1px 3px rgba(0,0,0,.1); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
        .card h3 { font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
        .form-row { margin-bottom:10px; }
        .form-row label { display:block; font-size:12px; color:#999; margin-bottom:3px; }
        .form-row input, .form-row select, .form-row textarea { width:100%; padding:10px 12px; border:1px solid #e0e0e0; border-radius:8px; font-size:14px; font-family:inherit; -webkit-appearance:none; }
        .form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline:none; border-color:#6c5ce7; }
        textarea { resize:vertical; min-height:60px; }
        .form-col2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .btn { width:100%; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; margin-top:4px; }
        .btn-primary { background:#6c5ce7; color:#fff; }
        .btn-primary:active { background:#5a4bd1; }
        .btn-warning { background:#fdcb6e; color:#333; }
        .btn-success { background:#00b894; color:#fff; }
        .btn-danger { background:#e17055; color:#fff; }
        .toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#00b894; color:#fff; padding:10px 24px; border-radius:20px; font-size:13px; font-weight:600; z-index:999; display:none; }
        .toast.show { display:block; animation: fadeInOut 2s; }
        @keyframes fadeInOut { 0%{opacity:0;transform:translateX(-50%) translateY(-10px)} 20%{opacity:1;transform:translateX(-50%) translateY(0)} 80%{opacity:1} 100%{opacity:0} }
        .recent-card { font-size:13px; padding:10px; background:#f8f9fa; border-radius:8px; margin-bottom:8px; }
        .recent-card .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:10px; font-weight:600; }
        .badge-purple { background:#f4f0ff; color:#6c5ce7; }
        .badge-danger { background:#fde8e4; color:#e17055; }
        .badge-success { background:#e8f8f5; color:#00b894; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📡 图拉斯直播中控</h1>
        <p>手机快速录入 · 数据即时同步</p>
    </div>
    <div class="toast" id="toast"></div>

    <!-- Tab 切换 -->
    <div class="tabs">
        <button class="active" onclick="switchTab('session')">开播/下播</button>
        <button onclick="switchTab('scenario')">转化场景</button>
        <button onclick="switchTab('question')">问题/话术</button>
        <button onclick="switchTab('search')">查话术</button>
    </div>

    <!-- Tab 1: 开播 -->
    <div class="tab-content active" id="tab-session">
        <div class="card">
            <h3>🚀 快速开播</h3>
            <form id="sessionForm">
                <div class="form-row">
                    <label>日期</label>
                    <input type="date" id="sess_date" required>
                </div>
                <div class="form-col2">
                    <div class="form-row">
                        <label>开始时间</label>
                        <input type="time" id="sess_start">
                    </div>
                    <div class="form-row">
                        <label>结束时间</label>
                        <input type="time" id="sess_end">
                    </div>
                </div>
                <div class="form-col2">
                    <div class="form-row">
                        <label>观看人数</label>
                        <input type="number" id="sess_viewers" value="0">
                    </div>
                    <div class="form-row">
                        <label>峰值在线</label>
                        <input type="number" id="sess_peak" value="0">
                    </div>
                </div>
                <div class="form-col2">
                    <div class="form-row">
                        <label>订单数</label>
                        <input type="number" id="sess_orders" value="0">
                    </div>
                    <div class="form-row">
                        <label>GMV (元)</label>
                        <input type="number" step="0.01" id="sess_gmv" value="0">
                    </div>
                </div>
                <div class="form-row">
                    <label>备注</label>
                    <input type="text" id="sess_notes" placeholder="如：周末专场">
                </div>
                <button type="submit" class="btn btn-primary">记录场次</button>
            </form>
        </div>
        <div class="card">
            <h3>📋 最近场次</h3>
            <div id="recentSessions">加载中...</div>
        </div>
    </div>

    <!-- Tab 2: 转化场景 -->
    <div class="tab-content" id="tab-scenario">
        <div class="card">
            <h3>🔥 记录高转化场景</h3>
            <p style="font-size:11px;color:#999;margin-bottom:12px;">看到订单暴涨时，立刻记录这个时刻</p>
            <form id="scenarioForm">
                <div class="form-row">
                    <label>场次</label>
                    <select id="scen_session"></select>
                </div>
                <div class="form-row">
                    <label>场景类型</label>
                    <select id="scen_type">
                        <option>限时秒杀</option><option>痛点讲解</option><option>功能演示</option>
                        <option>信任背书</option><option>价格锚点</option><option>逼单话术</option><option>其他</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>触发动作（主播做了什么）</label>
                    <textarea id="scen_action" placeholder="例如：展示了香薰的除异味效果，弹幕开始刷'想买'"></textarea>
                </div>
                <div class="form-col2">
                    <div class="form-row">
                        <label>之前单量</label>
                        <input type="number" id="scen_before" value="0">
                    </div>
                    <div class="form-row">
                        <label>之后单量</label>
                        <input type="number" id="scen_after" value="0">
                    </div>
                </div>
                <button type="submit" class="btn btn-warning">记录场景</button>
            </form>
        </div>
    </div>

    <!-- Tab 3: 问题/话术 -->
    <div class="tab-content" id="tab-question">
        <div class="card">
            <h3>❓ 记录观众问题</h3>
            <form id="questionForm">
                <div class="form-row">
                    <label>问题内容</label>
                    <input type="text" id="q_text" placeholder="观众具体问了什么？" required>
                </div>
                <div class="form-col2">
                    <div class="form-row">
                        <label>分类</label>
                        <select id="q_cat"><option>产品</option><option>价格</option><option>物流</option><option>售后</option><option>功能</option><option>竞品</option><option>活动</option></select>
                    </div>
                    <div class="form-row">
                        <label>难度</label>
                        <select id="q_diff"><option>简单</option><option selected>中等</option><option>困难</option><option>敏感</option></select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">录入问题</button>
            </form>
        </div>
        <div class="card">
            <h3>📝 快速录话术</h3>
            <form id="scriptForm">
                <div class="form-row">
                    <label>关联问题</label>
                    <select id="sc_qid"><option value="">-- 先选问题 --</option></select>
                </div>
                <div class="form-row">
                    <label>话术全文</label>
                    <textarea id="sc_text" placeholder="主播具体怎么回答的？" required></textarea>
                </div>
                <div class="form-col2">
                    <div class="form-row">
                        <label>类型</label>
                        <select id="sc_type"><option>标准应答</option><option>促单话术</option><option>逼单话术</option><option>危机应答</option></select>
                    </div>
                    <div class="form-row">
                        <label>评分(1-5)</label>
                        <input type="number" id="sc_score" value="3" min="1" max="5" step="0.5">
                    </div>
                </div>
                <button type="submit" class="btn btn-success">录入话术</button>
            </form>
        </div>
    </div>

    <!-- Tab 4: 搜索 -->
    <div class="tab-content" id="tab-search">
        <div class="card">
            <h3>🔍 查话术 / 查违规词</h3>
            <div class="form-row">
                <input type="text" id="searchInput" placeholder="输入观众问题关键词..." onkeyup="if(event.key==='Enter')doSearch()">
            </div>
            <button class="btn btn-primary" onclick="doSearch()">搜索</button>
            <div id="searchResults" style="margin-top:12px;"></div>
        </div>
    </div>

<script>
// Tab 切换
function switchTab(name) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    event.target.classList.add('active');
    if (name === 'scenario') loadSessions();
    if (name === 'question') loadQuestionsForSelect();
    if (name === 'session') loadRecentSessions();
}

// Toast
function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

// 日期
document.getElementById('sess_date').value = new Date().toISOString().split('T')[0];

// 提交场次
document.getElementById('sessionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var fd = new FormData();
    fd.append('session_date', document.getElementById('sess_date').value);
    fd.append('start_time', document.getElementById('sess_start').value);
    fd.append('end_time', document.getElementById('sess_end').value);
    fd.append('platform', '抖音');
    fd.append('total_viewers', document.getElementById('sess_viewers').value);
    fd.append('peak_online', document.getElementById('sess_peak').value);
    fd.append('total_orders', document.getElementById('sess_orders').value);
    fd.append('total_gmv', document.getElementById('sess_gmv').value);
    fd.append('notes', document.getElementById('sess_notes').value);
    fetch('/sessions/add', {method:'POST', body:fd}).then(function() {
        showToast('场次已记录!');
        loadRecentSessions();
    });
});

// 加载最近场次
function loadRecentSessions() {
    fetch('/sessions').then(function(r) { return r.text(); }).then(function(html) {
        var div = document.createElement('div'); div.innerHTML = html;
        var rows = div.querySelectorAll('table tr'); var out = '';
        for (var i=1; i<Math.min(rows.length,6); i++) {
            var td = rows[i].querySelectorAll('td');
            if (td.length >= 9) {
                out += '<div class="recent-card"><strong>'+td[1].textContent+'</strong> '
                    + '<span class="badge badge-purple">'+td[3].textContent+'</span> '
                    + '订单:<b>'+td[6].textContent+'</b> GMV:<b>'+td[7].textContent+'</b></div>';
            }
        }
        document.getElementById('recentSessions').innerHTML = out || '暂无';
    });
}
loadRecentSessions();

// 加载场次下拉
function loadSessions() {
    fetch('/sessions').then(function(r) { return r.text(); }).then(function(html) {
        var div = document.createElement('div'); div.innerHTML = html;
        var rows = div.querySelectorAll('table tr');
        var opts = '<option value="">-- 选择 --</option>';
        for (var i=1; i<Math.min(rows.length,20); i++) {
            var td = rows[i].querySelectorAll('td');
            if (td.length >= 3) opts += '<option value="'+td[0].textContent+'">'+td[0].textContent+' - '+td[1].textContent+'</option>';
        }
        document.getElementById('scen_session').innerHTML = opts;
    });
}

// 提交场景
document.getElementById('scenarioForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var fd = new FormData();
    fd.append('session_id', document.getElementById('scen_session').value);
    fd.append('scenario_type', document.getElementById('scen_type').value);
    fd.append('trigger_action', document.getElementById('scen_action').value);
    fd.append('before_orders', document.getElementById('scen_before').value);
    fd.append('after_orders', document.getElementById('scen_after').value);
    fd.append('conversion_rate_delta',
        parseInt(document.getElementById('scen_after').value) - parseInt(document.getElementById('scen_before').value));
    fetch('/scenarios/add', {method:'POST', body:fd}).then(function() { showToast('场景已记录!'); });
});

// 加载问题下拉
function loadQuestionsForSelect() {
    fetch('/questions').then(function(r) { return r.text(); }).then(function(html) {
        var div = document.createElement('div'); div.innerHTML = html;
        var rows = div.querySelectorAll('table tr');
        var opts = '<option value="">-- 选择 --</option>';
        for (var i=1; i<Math.min(rows.length,30); i++) {
            var td = rows[i].querySelectorAll('td');
            if (td.length >= 3) opts += '<option value="'+td[0].textContent+'">'+td[1].textContent.substring(0,25)+'</option>';
        }
        document.getElementById('sc_qid').innerHTML = opts;
    });
}

// 提交问题
document.getElementById('questionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var fd = new FormData();
    fd.append('question_text', document.getElementById('q_text').value);
    fd.append('category', document.getElementById('q_cat').value);
    fd.append('difficulty', document.getElementById('q_diff').value);
    fd.append('is_sensitive', document.getElementById('q_diff').value === '敏感' ? '1' : '0');
    fetch('/questions/add', {method:'POST', body:fd}).then(function() {
        showToast('问题已记录!');
        document.getElementById('q_text').value = '';
        loadQuestionsForSelect();
    });
});

// 提交话术
document.getElementById('scriptForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var fd = new FormData();
    fd.append('question_id', document.getElementById('sc_qid').value);
    fd.append('script_text', document.getElementById('sc_text').value);
    fd.append('script_type', document.getElementById('sc_type').value);
    fd.append('effectiveness_score', document.getElementById('sc_score').value || '3');
    fetch('/scripts/add', {method:'POST', body:fd}).then(function() {
        showToast('话术已录入!');
        document.getElementById('sc_text').value = '';
    });
});

// 搜索
function doSearch() {
    var kw = document.getElementById('searchInput').value.trim();
    if (!kw) return;
    document.getElementById('searchResults').innerHTML = '搜索中...';
    fetch('/search?q=' + encodeURIComponent(kw)).then(function(r) { return r.text(); }).then(function(html) {
        var div = document.createElement('div'); div.innerHTML = html;
        var cards = div.querySelectorAll('.card'); var out = '';
        for (var i=1; i<cards.length; i++) {
            var h2 = cards[i].querySelector('h2');
            var title = h2 ? h2.textContent : '';
            var items = cards[i].querySelectorAll('tr');
            out += '<div style="font-size:12px;font-weight:700;margin-top:12px;color:#999;">'+title+'</div>';
            for (var j=1; j<Math.min(items.length,5); j++) {
                out += '<div style="font-size:13px;padding:4px 0;border-bottom:1px solid #eee;">'+items[j].textContent.substring(0,60)+'</div>';
            }
        }
        document.getElementById('searchResults').innerHTML = out || '<p style="color:#999;">未找到结果</p>';
    });
}
</script>
</body>
</html>

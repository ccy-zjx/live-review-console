<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}图拉斯直播中控台{% endblock %}</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #f5f6fa; --card-bg: #fff; --text: #2d3436; --muted: #636e72;
            --primary: #6c5ce7; --primary-light: #a29bfe; --danger: #e17055;
            --warning: #fdcb6e; --success: #00b894; --info: #0984e3;
            --border: #dfe6e9; --shadow: 0 2px 8px rgba(0,0,0,.08);
            --radius: 10px;
        }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
        /* Sidebar */
        .sidebar { width:220px; background: #2d3436; color:#fff; padding:20px 0; position:fixed; top:0; left:0; bottom:0; overflow-y:auto; z-index:100; }
        .sidebar .logo { padding:0 20px 20px; font-size:16px; font-weight:700; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:10px; }
        .sidebar .logo span { color:var(--primary-light); }
        .sidebar a { display:flex; align-items:center; gap:10px; padding:12px 20px; color:rgba(255,255,255,.7); text-decoration:none; font-size:14px; transition:.2s; }
        .sidebar a:hover, .sidebar a.active { color:#fff; background:rgba(255,255,255,.08); }
        .sidebar a .icon { font-size:18px; width:24px; text-align:center; }
        .sidebar .section-title { padding:16px 20px 8px; font-size:11px; text-transform:uppercase; color:rgba(255,255,255,.35); letter-spacing:1px; }
        /* Main */
        .main { margin-left:220px; flex:1; padding:24px; max-width:calc(100vw - 220px); }
        .page-header { margin-bottom:24px; }
        .page-header h1 { font-size:22px; margin-bottom:4px; }
        .page-header p { color:var(--muted); font-size:14px; }
        /* Cards */
        .card { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:20px; }
        .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .card-header h2 { font-size:16px; }
        /* Stats row */
        .stats-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px; margin-bottom:24px; }
        .stat-card { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; text-align:center; }
        .stat-card .value { font-size:32px; font-weight:700; color:var(--primary); }
        .stat-card .label { font-size:13px; color:var(--muted); margin-top:4px; }
        /* Tables */
        table { width:100%; border-collapse:collapse; font-size:13px; }
        th { text-align:left; padding:10px 12px; background:#f8f9fa; font-weight:600; color:var(--muted); border-bottom:2px solid var(--border); white-space:nowrap; }
        td { padding:10px 12px; border-bottom:1px solid var(--border); }
        tr:hover td { background:#f8f9fa; }
        /* Badges */
        .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; }
        .badge-success { background:#e8f8f5; color:#00b894; }
        .badge-danger { background:#fde8e4; color:#e17055; }
        .badge-warning { background:#fef5e7; color:#f39c12; }
        .badge-info { background:#eaf2f8; color:#0984e3; }
        .badge-purple { background:#f4f0ff; color:#6c5ce7; }
        /* Buttons */
        .btn { display:inline-block; padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; text-decoration:none; transition:.2s; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:#5a4bd1; }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-danger:hover { background:#d63031; }
        .btn-outline { background:#fff; color:var(--primary); border:1px solid var(--primary); }
        .btn-sm { padding:4px 12px; font-size:12px; }
        .btn-xs { padding:2px 8px; font-size:11px; }
        /* Forms */
        .form-group { margin-bottom:12px; }
        .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; color:var(--muted); }
        .form-control, input, select, textarea { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; transition:.2s; }
        .form-control:focus, input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(108,92,231,.15); }
        textarea { resize:vertical; min-height:80px; }
        /* Grid */
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .grid-3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
        @media (max-width:768px) { .grid-2, .grid-3 { grid-template-columns:1fr; } .sidebar { width:60px; } .main { margin-left:60px; } }
        /* Modal overlay */
        .modal-overlay { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,.5); z-index:200; justify-content:center; align-items:center; }
        .modal-overlay.show { display:flex; }
        .modal { background:#fff; border-radius:var(--radius); padding:24px; width:90%; max-width:600px; max-height:80vh; overflow-y:auto; }
        .modal h2 { margin-bottom:16px; }
        /* Search highlight */
        .highlight { background:#fef08a; padding:1px 4px; border-radius:2px; }
        /* Tabs */
        .tabs { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:20px; }
        .tabs a { padding:10px 20px; text-decoration:none; color:var(--muted); font-size:14px; border-bottom:2px solid transparent; margin-bottom:-2px; transition:.2s; }
        .tabs a.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
        /* Empty state */
        .empty { text-align:center; padding:40px; color:var(--muted); }
        .empty .emoji { font-size:48px; margin-bottom:12px; }
        /* Flash messages */
        .flash { padding:10px 16px; border-radius:6px; margin-bottom:16px; font-size:13px; }
        .flash-success { background:#e8f8f5; color:#00b894; }
        .flash-error { background:#fde8e4; color:#e17055; }
        /* Inline form */
        .inline-form { display:inline; }
        /* Search input */
        .search-bar { display:flex; gap:8px; margin-bottom:20px; }
        .search-bar input { flex:1; padding:10px 16px; font-size:15px; }
        .search-bar button { padding:10px 24px; font-size:15px; }
        /* Violation check result */
        .check-result { margin-top:16px; padding:16px; border-radius:8px; }
        .check-result.safe { background:#e8f8f5; border:1px solid #00b894; }
        .check-result.unsafe { background:#fde8e4; border:1px solid #e17055; }
        /* Pagination / misc */
        .text-muted { color:var(--muted); font-size:12px; }
        .text-danger { color:var(--danger); }
        .text-success { color:var(--success); }
        .mb-16 { margin-bottom:16px; }
        .mr-8 { margin-right:8px; }
        .mt-8 { margin-top:8px; }
        .flex { display:flex; align-items:center; gap:8px; }
        .flex-between { display:flex; justify-content:space-between; align-items:center; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="sidebar">
        <div class="logo"><span>🎯</span> 直播中控台</div>
        <a href="{{ url_for('index') }}" class="{% if request.path == '/' %}active{% endif %}">
            <span class="icon">📊</span> 首页仪表盘
        </a>
        <a href="{{ url_for('daily_report') }}" class="{% if request.path == '/daily' %}active{% endif %}">
            <span class="icon">📰</span> 今日日报
        </a>
        <div class="section-title">数据管理</div>
        <a href="{{ url_for('sessions_list') }}" class="{% if '/sessions' in request.path %}active{% endif %}">
            <span class="icon">📡</span> 直播场次
        </a>
        <a href="{{ url_for('scenarios_list') }}" class="{% if request.path == '/scenarios' %}active{% endif %}">
            <span class="icon">🔥</span> 高转化场景
        </a>
        <a href="{{ url_for('cheat_sheet') }}" class="{% if request.path == '/cheatsheet' %}active{% endif %}">
            <span class="icon">📋</span> 速查表
        </a>
        <a href="{{ url_for('questions_list') }}" class="{% if request.path.startswith('/questions') %}active{% endif %}">
            <span class="icon">❓</span> 问题库
        </a>
        <a href="{{ url_for('scripts_list') }}" class="{% if request.path == '/scripts' %}active{% endif %}">
            <span class="icon">📝</span> 话术库
        </a>
        <a href="{{ url_for('ab_tests_list') }}" class="{% if request.path == '/ab-tests' %}active{% endif %}">
            <span class="icon">⚖️</span> A/B 对比
        </a>
        <div class="section-title">合规 & 工具</div>
        <a href="{{ url_for('violations_list') }}" class="{% if request.path == '/violations' %}active{% endif %}">
            <span class="icon">🚫</span> 违规管理
        </a>
        <a href="{{ url_for('import_page') }}" class="{% if request.path == '/import' %}active{% endif %}">
            <span class="icon">📥</span> 数据导入
        </a>
        <a href="{{ url_for('search_page') }}" class="{% if request.path == '/search' %}active{% endif %}">
            <span class="icon">🔍</span> 实时检索
        </a>
        <div class="section-title">系统</div>
        <a href="{{ url_for('mobile_page') }}" class="{% if request.path == '/mobile' %}active{% endif %}">
            <span class="icon">📱</span> 手机版
        </a>
        <a href="{{ url_for('status_page') }}" class="{% if request.path == '/status' %}active{% endif %}">
            <span class="icon">🌐</span> 连接信息
        </a>
    </nav>
    <div class="main">
        {% block content %}{% endblock %}
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>

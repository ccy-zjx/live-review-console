<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接信息 - 直播中控台</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background:#f5f6fa; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .card { background:#fff; padding:40px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.1); width:500px; text-align:center; }
        .card h1 { font-size:20px; margin-bottom:24px; }
        .info { text-align:left; background:#f8f9fa; padding:20px; border-radius:8px; margin-bottom:16px; }
        .info .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee; font-size:14px; }
        .info .row:last-child { border-bottom:none; }
        .info .label { color:#636e72; }
        .info .value { font-weight:700; color:#6c5ce7; font-family:monospace; font-size:16px; }
        .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
        .badge-on { background:#e8f8f5; color:#00b894; }
        .badge-off { background:#fef5e7; color:#f39c12; }
    </style>
</head>
<body>
    <div class="card">
        <h1>网络连接信息</h1>
        <div class="info">
            <div class="row">
                <span class="label">本机访问</span>
                <span class="value">http://127.0.0.1:5000</span>
            </div>
            <div class="row">
                <span class="label">局域网访问（发给同事）</span>
                <span class="value">http://{{ lan_ip }}:5000</span>
            </div>
            <div class="row">
                <span class="label">密码保护</span>
                <span><span class="badge {% if has_password %}badge-on{% else %}badge-off{% endif %}">{% if has_password %}ON{% else %}OFF{% endif %}</span></span>
            </div>
        </div>
        <p style="font-size:13px; color:#636e72;">
            同事在浏览器输入上面那个局域网地址即可。<br>
            如果同事连不上，检查 Windows 防火墙是否放行 5000 端口。
        </p>
    </div>
</body>
</html>
